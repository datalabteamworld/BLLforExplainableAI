[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-delivery-risk"
version = "0.1.0"
description = "Pre-dispatch late-delivery risk prediction for the Olist marketplace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "joblib>=1.3",
    "workalendar>=17.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "shap>=0.44",
    "reportlab>=4.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.26"]
dev = ["pytest>=7.4"]

[project.scripts]
olist-validate = "olist.validate:main"
olist-train = "olist.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
